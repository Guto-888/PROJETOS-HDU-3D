<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#111111">
  <title>HDU | Modelo 3D 007-0000</title>

  <script type="module"
    src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js">
  </script>

  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
      background: #f3f4f6;
    }

    .app {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
    }

    header {
      height: 64px;
      flex: 0 0 64px;
      background: #111;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,.20);
      z-index: 10;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-mark {
      width: 42px;
      height: 42px;
      border: 2px solid #fff;
      border-radius: 8px;
      display: grid;
      place-items: center;
      font-weight: 800;
      font-size: 18px;
      letter-spacing: -1px;
    }

    .brand-text {
      line-height: 1.05;
    }

    .brand-name {
      font-size: 18px;
      font-weight: 800;
      letter-spacing: 1px;
    }

    .brand-sub {
      font-size: 11px;
      opacity: .72;
      margin-top: 3px;
    }

    .part {
      text-align: right;
    }

    .part-label {
      font-size: 10px;
      opacity: .65;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .part-number {
      font-size: 18px;
      font-weight: 700;
      margin-top: 2px;
    }

    main {
      position: relative;
      flex: 1;
      min-height: 0;
    }

    model-viewer {
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #f8fafc, #e5e7eb);
      --poster-color: transparent;
    }

    .info {
      position: absolute;
      left: 16px;
      top: 16px;
      padding: 10px 13px;
      background: rgba(255,255,255,.88);
      backdrop-filter: blur(6px);
      border: 1px solid rgba(0,0,0,.08);
      border-radius: 10px;
      box-shadow: 0 3px 14px rgba(0,0,0,.10);
      color: #222;
      pointer-events: none;
    }

    .info strong {
      display: block;
      font-size: 13px;
    }

    .info span {
      display: block;
      font-size: 11px;
      color: #666;
      margin-top: 3px;
    }

    .controls {
      position: absolute;
      left: 50%;
      bottom: 18px;
      transform: translateX(-50%);
      display: flex;
      gap: 8px;
      padding: 9px;
      background: rgba(17,17,17,.90);
      border-radius: 14px;
      box-shadow: 0 5px 20px rgba(0,0,0,.25);
    }

    button {
      min-width: 48px;
      height: 42px;
      border: 0;
      border-radius: 9px;
      background: #fff;
      color: #111;
      cursor: pointer;
      font-size: 20px;
      font-weight: 700;
      touch-action: manipulation;
    }

    button:hover {
      background: #e5e7eb;
    }

    button:active {
      transform: scale(.96);
    }

    .tooltip {
      position: absolute;
      bottom: 72px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(17,17,17,.92);
      color: white;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 11px;
      white-space: nowrap;
      opacity: 0;
      transition: opacity .2s;
      pointer-events: none;
    }

    @media (max-width: 600px) {
      header {
        height: 58px;
        flex-basis: 58px;
        padding: 0 12px;
      }

      .brand-mark {
        width: 36px;
        height: 36px;
        font-size: 15px;
      }

      .brand-name { font-size: 15px; }
      .brand-sub { font-size: 9px; }
      .part-number { font-size: 15px; }

      .info {
        left: 10px;
        top: 10px;
      }

      .controls {
        bottom: 12px;
        padding: 7px;
      }

      button {
        min-width: 44px;
        height: 40px;
      }
    }
  </style>
</head>

<body>
<div class="app">

  <header>
    <div class="brand">
      <div class="brand-mark">HDU</div>
      <div class="brand-text">
        <div class="brand-name">HDU</div>
        <div class="brand-sub">VISUALIZAÇÃO 3D</div>
      </div>
    </div>

    <div class="part">
      <div class="part-label">Projeto / Peça</div>
      <div class="part-number">007-0000</div>
    </div>
  </header>

  <main>
    <model-viewer
      id="viewer"
      src="007-0000.glb"
      alt="Modelo 3D HDU 007-0000"
      camera-controls
      touch-action="pan-y"
      shadow-intensity="1"
      exposure="1"
      environment-image="neutral"
      interaction-prompt="auto"
      loading="eager">
    </model-viewer>

    <div class="info">
      <strong>Modelo 3D — 007-0000</strong>
      <span>Arraste para girar • Use dois dedos para zoom</span>
    </div>

    <div class="controls">
      <button id="rotateLeft" title="Girar para a esquerda">↶</button>
      <button id="rotateRight" title="Girar para a direita">↷</button>
      <button id="zoomIn" title="Aproximar">＋</button>
      <button id="zoomOut" title="Afastar">－</button>
      <button id="fullscreen" title="Tela cheia">⛶</button>
    </div>

    <div class="tooltip" id="tooltip"></div>
  </main>
</div>

<script>
  const viewer = document.getElementById('viewer');
  const tooltip = document.getElementById('tooltip');

  function showTip(text) {
    tooltip.textContent = text;
    tooltip.style.opacity = '1';
    clearTimeout(window.tipTimer);
    window.tipTimer = setTimeout(() => {
      tooltip.style.opacity = '0';
    }, 900);
  }

  document.getElementById('rotateLeft').addEventListener('click', () => {
    const orbit = viewer.getCameraOrbit();
    orbit.theta -= Math.PI / 8;
    viewer.cameraOrbit = `${orbit.theta}rad ${orbit.phi}rad ${orbit.radius}m`;
    showTip('Girar para esquerda');
  });

  document.getElementById('rotateRight').addEventListener('click', () => {
    const orbit = viewer.getCameraOrbit();
    orbit.theta += Math.PI / 8;
    viewer.cameraOrbit = `${orbit.theta}rad ${orbit.phi}rad ${orbit.radius}m`;
    showTip('Girar para direita');
  });

  document.getElementById('zoomIn').addEventListener('click', () => {
    const orbit = viewer.getCameraOrbit();
    const radius = Math.max(orbit.radius * 0.82, 0.1);
    viewer.cameraOrbit = `${orbit.theta}rad ${orbit.phi}rad ${radius}m`;
    showTip('Aproximar');
  });

  document.getElementById('zoomOut').addEventListener('click', () => {
    const orbit = viewer.getCameraOrbit();
    const radius = Math.min(orbit.radius * 1.22, 1000);
    viewer.cameraOrbit = `${orbit.theta}rad ${orbit.phi}rad ${radius}m`;
    showTip('Afastar');
  });

  document.getElementById('fullscreen').addEventListener('click', async () => {
    try {
      if (!document.fullscreenElement) {
        await document.documentElement.requestFullscreen();
      } else {
        await document.exitFullscreen();
      }
    } catch (e) {
      showTip('Tela cheia não disponível neste navegador');
    }
  });
</script>

</body>
</html>
