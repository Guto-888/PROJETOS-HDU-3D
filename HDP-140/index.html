<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HDP-140 — Modelo 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#DDE1E6;
    --bg-2:#EDEFF2;
    --panel:rgba(255,255,255,.82);
    --ink:#1A2027;
    --ink-2:#5C6874;
    --line:#BFC7CF;
    --accent:#9A6B00;
    --accent-ink:#1A2027;
    --grid:rgba(26,32,39,.06);
    --shade-bottom:#C8CDD3;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#161B21;
      --bg-2:#1E242B;
      --panel:rgba(22,27,33,.78);
      --ink:#E9EDF1;
      --ink-2:#97A3AF;
      --line:#333D48;
      --accent:#FFC300;
      --accent-ink:#161B21;
      --grid:rgba(233,237,241,.05);
      --shade-bottom:#11151A;
    }
  }
  :root[data-theme="dark"]{
    --bg:#161B21;
    --bg-2:#1E242B;
    --panel:rgba(22,27,33,.78);
    --ink:#E9EDF1;
    --ink-2:#97A3AF;
    --line:#333D48;
    --accent:#FFC300;
    --accent-ink:#161B21;
    --grid:rgba(233,237,241,.05);
    --shade-bottom:#11151A;
  }

  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'Archivo','Helvetica Neue',Arial,sans-serif;
    font-size:16px;
    line-height:1.45;
    -webkit-font-smoothing:antialiased;
    overflow:hidden;
  }

  .stage{
    position:fixed;
    inset:0;
    display:grid;
    grid-template-rows:auto 1fr auto;
    background:
      linear-gradient(to bottom, var(--bg-2) 0%, var(--bg) 58%, var(--shade-bottom) 100%);
  }

  /* ---------- top bar ---------- */
  header{
    display:flex;
    align-items:baseline;
    gap:14px;
    padding:14px 18px 12px;
    border-bottom:1px solid var(--line);
    background:var(--panel);
    backdrop-filter:blur(8px);
    z-index:3;
  }
  .mark{
    font-weight:700;
    font-size:15px;
    letter-spacing:.12em;
    padding:3px 7px;
    border:2px solid var(--ink);
    border-radius:2px;
    line-height:1;
    flex:none;
  }
  .id{
    font-weight:700;
    font-size:22px;
    letter-spacing:-.01em;
    line-height:1;
  }
  .id span{font-weight:400;color:var(--ink-2);font-size:15px;margin-left:10px;letter-spacing:0}
  header .spacer{flex:1}
  .theme-btn{
    flex:none;
    font:inherit;
    font-size:13px;
    color:var(--ink-2);
    background:none;
    border:1px solid var(--line);
    border-radius:2px;
    padding:5px 10px;
    cursor:pointer;
  }
  .theme-btn:hover{color:var(--ink);border-color:var(--ink-2)}

  /* ---------- viewer ---------- */
  .viewport{position:relative;min-height:0}
  model-viewer{
    width:100%;
    height:100%;
    --poster-color:transparent;
    background:transparent;
    outline:none;
  }
  model-viewer::part(default-progress-bar){display:none}

  /* measured dimensions, pinned to the model */
  .specs{
    position:absolute;
    top:16px;
    right:16px;
    z-index:2;
    background:var(--panel);
    backdrop-filter:blur(8px);
    border:1px solid var(--line);
    border-radius:3px;
    padding:12px 14px;
    min-width:172px;
    opacity:0;
    transition:opacity .4s ease;
  }
  .specs.ready{opacity:1}
  .specs h2{
    margin:0 0 8px;
    font-size:12px;
    font-weight:600;
    color:var(--ink-2);
    letter-spacing:.02em;
  }
  .specs dl{margin:0;display:grid;grid-template-columns:1fr auto;gap:5px 16px;align-items:baseline}
  .specs dt{font-size:14px;color:var(--ink-2)}
  .specs dd{
    margin:0;
    font-size:15px;
    font-weight:600;
    font-variant-numeric:tabular-nums;
    text-align:right;
  }
  .specs .note{
    margin:10px 0 0;
    padding-top:9px;
    border-top:1px solid var(--line);
    font-size:12px;
    line-height:1.35;
    color:var(--ink-2);
  }

  /* loading + error */
  .curtain{
    position:absolute;
    inset:0;
    z-index:4;
    display:grid;
    place-content:center;
    justify-items:center;
    gap:16px;
    padding:24px;
    text-align:center;
    background:var(--bg);
  }
  .curtain[hidden]{display:none}
  .curtain p{margin:0;font-size:15px;color:var(--ink-2);max-width:34ch}
  .bar{width:210px;height:3px;background:var(--line);border-radius:2px;overflow:hidden}
  .bar i{display:block;height:100%;width:0%;background:var(--accent);transition:width .25s ease}
  .curtain .id{font-size:28px}

  /* ---------- controls ---------- */
  footer{
    display:flex;
    flex-wrap:wrap;
    align-items:center;
    gap:8px;
    padding:12px 18px calc(12px + env(safe-area-inset-bottom));
    border-top:1px solid var(--line);
    background:var(--panel);
    backdrop-filter:blur(8px);
    z-index:3;
  }
  .hint{flex:1;min-width:190px;font-size:13px;color:var(--ink-2)}
  button.ctl{
    font:inherit;
    font-size:14px;
    font-weight:500;
    color:var(--ink);
    background:transparent;
    border:1px solid var(--line);
    border-radius:2px;
    padding:8px 14px;
    cursor:pointer;
    transition:border-color .15s ease,background .15s ease;
  }
  button.ctl:hover{border-color:var(--ink-2)}
  button.ctl[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
  button.ctl.primary{
    background:var(--accent);
    border-color:var(--accent);
    color:var(--accent-ink);
    font-weight:600;
  }
  button.ctl:focus-visible,.theme-btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  button.ctl[hidden]{display:none}

  @media (max-width:640px){
    header{padding:11px 14px 9px;gap:10px}
    .id{font-size:18px}
    .id span{display:none}
    .specs{top:10px;right:10px;left:10px;min-width:0;padding:10px 12px}
    .specs .note{display:none}
    footer{padding:10px 14px calc(10px + env(safe-area-inset-bottom))}
    .hint{order:3;flex-basis:100%;min-width:0}
    button.ctl{flex:1}
  }
  @media (prefers-reduced-motion:reduce){
    *{transition:none !important;animation:none !important}
  }
</style>
</head>
<body>
<div class="stage">

  <header>
    <div class="mark">HDU</div>
    <div class="id">HDP-140 <span>conjunto montado</span></div>
    <div class="spacer"></div>
    <button class="theme-btn" id="theme" type="button">Modo claro</button>
  </header>

  <div class="viewport">
    <model-viewer
      id="mv"
      alt="Modelo 3D do conjunto HDP-140"
      camera-controls
      touch-action="none"
      interaction-prompt="none"
      shadow-intensity="0.9"
      shadow-softness="0.7"
      exposure="1.05"
      environment-image="neutral"
      min-field-of-view="5deg"
      camera-orbit="35deg 72deg auto"
      ar
      ar-modes="webxr scene-viewer"
      ar-scale="fixed">
    </model-viewer>

    <aside class="specs" id="specs">
      <h2>Dimensões do modelo</h2>
      <dl>
        <dt>Altura</dt><dd id="d-h">—</dd>
        <dt>Largura</dt><dd id="d-w">—</dd>
        <dt>Profundidade</dt><dd id="d-d">—</dd>
      </dl>
      <p class="note">Medidas extraídas da caixa envolvente do modelo. Consulte o desenho de fabricação para cotas oficiais.</p>
    </aside>

    <div class="curtain" id="curtain">
      <div class="id">HDP-140</div>
      <div class="bar"><i id="bar"></i></div>
      <p id="curtain-msg">Carregando o modelo.</p>
    </div>
  </div>

  <footer>
    <p class="hint" id="hint">Arraste para girar. Role ou use dois dedos para aproximar.</p>
    <button class="ctl" id="spin" type="button" aria-pressed="false">Girar</button>
    <button class="ctl" id="frame" type="button">Enquadrar</button>
    <button class="ctl primary" id="ar" type="button" hidden>Ver no local</button>
  </footer>

</div>

<script type="module">
  const curtain = document.getElementById('curtain');
  const msg = document.getElementById('curtain-msg');
  const bar = document.getElementById('bar');

  function fail(text){
    bar.parentElement.style.display = 'none';
    msg.textContent = text;
    curtain.hidden = false;
  }

  let ModelViewerElement;
  try {
    ({ModelViewerElement} = await import('https://cdn.jsdelivr.net/npm/@google/model-viewer@4.3.1/dist/model-viewer.min.js'));
  } catch (err) {
    fail('O visualizador 3D não carregou. Verifique a conexão e recarregue a página.');
    throw err;
  }
  // Geometry is meshopt-compressed; point the viewer at the decoder.
  ModelViewerElement.meshoptDecoderLocation =
    'https://cdn.jsdelivr.net/npm/meshoptimizer@0.20.0/meshopt_decoder.js';

  const mv = document.getElementById('mv');
  const specs = document.getElementById('specs');
  const spin = document.getElementById('spin');
  const frame = document.getElementById('frame');
  const arBtn = document.getElementById('ar');
  const hint = document.getElementById('hint');
  const HOME = '35deg 72deg auto';

  mv.addEventListener('progress', (e) => {
    bar.style.width = Math.round(e.detail.totalProgress * 100) + '%';
  });

  mv.addEventListener('error', () => {
    fail('Não foi possível abrir o modelo nesta página. Tente outro navegador ou recarregue.');
  });

  mv.addEventListener('load', () => {
    curtain.hidden = true;
    const d = mv.getDimensions();          // metres
    const fmt = (v) => v.toFixed(2).replace('.', ',') + ' m';
    document.getElementById('d-h').textContent = fmt(d.y);
    document.getElementById('d-w').textContent = fmt(Math.max(d.x, d.z));
    document.getElementById('d-d').textContent = fmt(Math.min(d.x, d.z));
    specs.classList.add('ready');
    if (mv.canActivateAR){
      arBtn.hidden = false;
      hint.textContent = 'Arraste para girar. Toque em “Ver no local” para posicionar o equipamento no espaço real.';
    }
  });

  spin.addEventListener('click', () => {
    const on = !mv.autoRotate;
    mv.autoRotate = on;
    spin.setAttribute('aria-pressed', String(on));
  });

  frame.addEventListener('click', () => {
    mv.autoRotate = false;
    spin.setAttribute('aria-pressed', 'false');
    mv.resetTurntableRotation();
    mv.cameraOrbit = HOME;
    mv.cameraTarget = 'auto auto auto';
    mv.fieldOfView = 'auto';
    mv.jumpCameraToGoal();
  });

  arBtn.addEventListener('click', () => mv.activateAR());

  // Theme toggle, starting from the viewer's own setting.
  const themeBtn = document.getElementById('theme');
  const prefersDark = matchMedia('(prefers-color-scheme: dark)');
  let dark = prefersDark.matches;
  const paint = () => {
    document.documentElement.dataset.theme = dark ? 'dark' : 'light';
    themeBtn.textContent = dark ? 'Modo claro' : 'Modo escuro';
  };
  paint();
  themeBtn.addEventListener('click', () => { dark = !dark; paint(); });

  mv.src = './HDP-140.glb';
</script>
</body>
</html>
